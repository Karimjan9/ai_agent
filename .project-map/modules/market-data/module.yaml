dependencies:
invariants:
  - The explicit unchanged G263 price-discovery owner reuses verified secondary archive attribution and bounded MTF readiness without repairing the old native seventeen-gap dependency. Native BID/secondary composite MID remain modeled research prices; no quotes, native volume, untouched window, full validation or paper eligibility is inferred (ADR-035).
  - Native training backfill commands fetch Dukascopy and accept only the exact dukascopy provider identity before any archive creation; a secondary-provider label cannot rename native price rows. Separate secondary observations do not repair an immutable Dukascopy dataset or establish unused validation data.
  - Only the configured canonical provider repairs canonical continuity.
  - Scheduled market closures are interpreted through the shared session calendar.
  - Incomplete continuity blocks affected new research construction.
  - Explicit clean discovery seals 15000 evaluated M5 rows plus 512 warmup from a verified parent fork, selected by calendar continuity/recency, never outcomes. It does not certify parent continuity, full validation, independent evidence or trading authority.
  - Rolling/live volume coverage never attests a historical replay snapshot.
  - A volume-dependent historical replay requires a hash-bound provenance receipt and an explicit volume_available column in every consumed stream.
  - A no-volume lane is not a failed volume capability and reports not_requested.
  - Sparse historical provider bars are recovered only into a new content-addressed training dataset with actual provider/tick proof, immutable old-source SHA, economic-row digest and explicit remaining calendar gaps. Missing minutes are never synthesized; new price bytes require freshly hash-bound quote sidecars and do not constitute independent validation or promotion evidence.
  - Explicit v3 raw-tick recovery aggregates omitted candle minutes from hash-bound synchronized native Jetta/BI5 observations, validates observed M1 prices and six-decimal volume identity, reopens the raw evidence before readiness/resume, and never certifies uninterrupted tick history or inserts raw proofs into old v2 receipts.
  - Explicit secondary recovery creates a separate mixed price archive with raw-response proofs and row attribution. Only typed pre-2026 bounded clean discovery consumes it; ordinary native full validation remains fenced, unavailable volume/quotes stay unavailable and the verified original native bundle anchors the existing question budget.
  - Historical quote spread is a separate pre-2026 research sidecar; executable liquidity requires one synchronized BID/ASK tick strictly before M5 close, maximum age 60 seconds, matching frozen M5 BID, source hashes and availability. Independently closing Jetta BID/ASK bars are diagnostic only. Neither artifact backfills an existing generation or gains authority merely by existing.
