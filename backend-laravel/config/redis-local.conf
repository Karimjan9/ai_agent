# Project-local Redis runtime for Windows development.
# Bind only to loopback; this instance is not exposed to the network.
bind 127.0.0.1
protected-mode yes
port 6379
timeout 0
tcp-keepalive 60
databases 16
dir "C:/x_programs/xamp/htdocs/laravel_projects/ai_agent/backend-laravel/storage/framework/redis"
dbfilename neurotrader-dump.rdb
appendonly no
save 900 1
save 300 10
save 60 10000
logfile "C:/x_programs/xamp/htdocs/laravel_projects/ai_agent/backend-laravel/storage/framework/redis/redis.log"
